<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade Genius | Students</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-layout">


    <aside class="sidebar">

        <div class="sidebar-logo">

            <div class="sidebar-logo-mark">
                GG
            </div>

            <strong>
                Grade Genius
            </strong>

        </div>


        <nav class="sidebar-menu">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a
                href="students.html"
                class="active"
            >
                Students
            </a>

            <a href="chat.html">
                Messages
            </a>

            <a href="#">
                Profile
            </a>

            <a href="#">
                Settings
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <strong>
                Student Management
            </strong>

            <div class="user-info">

                <div class="user-avatar">
                    NH
                </div>

                <span>
                    Nkululeko
                </span>

            </div>

        </header>


        <section class="page-content">

            <div class="page-heading">

                <h1>
                    Students
                </h1>

                <p>
                    View and manage registered students.
                </p>

            </div>


            <div class="panel">

                <div class="panel-header">

                    <h2>
                        Student Records
                    </h2>

                    <a href="#">
                        + Add Student
                    </a>

                </div>


                <div class="table-wrapper">

                    <table class="data-table">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>First Name</th>

                                <th>Last Name</th>

                                <th>Email</th>

                                <th>Phone</th>

                                <th>Status</th>

                            </tr>

                        </thead>


                        <tbody id="studentsTable">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

</div>


<script>

async function loadStudents() {

    try {

        const response =
            await fetch("/students");

        const students =
            await response.json();


        const table =
            document.getElementById(
                "studentsTable"
            );


        table.innerHTML = "";


        students.forEach(student => {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${student.student_id}
                </td>

                <td>
                    ${student.first_name}
                </td>

                <td>
                    ${student.last_name}
                </td>

                <td>
                    ${student.email}
                </td>

                <td>
                    ${student.phone || "-"}
                </td>

                <td>
                    <span class="status">
                        Active
                    </span>
                </td>

            `;


            table.appendChild(row);

        });


    } catch (error) {

        console.error(
            "Unable to load students:",
            error
        );

    }

}


loadStudents();

</script>

</body>
</html>
