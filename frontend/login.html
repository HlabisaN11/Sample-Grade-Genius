<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade Genius | Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <!-- BRAND -->

        <div class="auth-header">

            <div class="brand-mark">
                GG
            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Sign in to access your Grade Genius account.
            </p>

        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
                id="loginButton"
            >

                Sign In

            </button>


            <div
                id="loginMessage"
                class="form-message"
            ></div>

        </form>


        <div class="auth-footer">

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </div>

    </div>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginButton.disabled = true;

        loginButton.textContent =
            "Signing in...";

        loginMessage.className =
            "form-message";

        loginMessage.textContent = "";


        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;


        try {

            const response =
                await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            const responseText =
                await response.text();


            let data;

            try {

                data =
                    JSON.parse(responseText);

            } catch (error) {

                console.error(
                    "Invalid server response:",
                    responseText
                );

                throw new Error(
                    "The server returned an invalid response."
                );

            }


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.message ||
                    "Login failed."
                );

            }


            // ====================================
            // SAVE CURRENT USER
            // ====================================

            localStorage.setItem(
                "gradeGeniusUser",
                JSON.stringify(data.user)
            );


            loginMessage.className =
                "form-message success";

            loginMessage.textContent =
                "Login successful. Opening dashboard...";


            // ====================================
            // GO TO DASHBOARD
            // ====================================

            setTimeout(
                () => {

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );

            loginMessage.className =
                "form-message error";

            loginMessage.textContent =
                error.message ||
                "Unable to sign in.";

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "Sign In";

    }
);

</script>

</body>

</html>
